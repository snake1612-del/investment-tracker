name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check formatting
        run: pnpm format:check

  api-quality:
    name: API quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright app tests
      - name: Unit tests
        run: uv run pytest tests/unit

  api-postgres:
    name: API PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: investment_tracker
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: investment_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investment_tracker -d investment_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://investment_tracker:ci_disposable_only@localhost:5432/investment_tracker
      TEST_DATABASE_URL: postgresql+psycopg://investment_tracker:ci_disposable_only@localhost:5432/investment_tracker_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked
      - name: Upgrade migrations
        run: uv run alembic upgrade head
      - name: Downgrade migrations
        run: uv run alembic downgrade base
      - name: Reapply migrations
        run: uv run alembic upgrade head
      - name: Check migration drift
        run: uv run alembic check
      - name: PostgreSQL tests
        run: uv run pytest
