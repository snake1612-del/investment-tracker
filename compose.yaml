services:
  web:
    build: ./apps/web
    init: true
    environment:
      API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 10

  api:
    build: ./apps/api
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://investment_tracker:local_development_only@db:5432/investment_tracker
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/migrations:/app/migrations
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: investment_tracker
      POSTGRES_USER: investment_tracker
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U investment_tracker -d investment_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  web_node_modules:
  web_next:
