services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: investment_tracker
      POSTGRES_USER: investment_tracker
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment_tracker -d investment_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
