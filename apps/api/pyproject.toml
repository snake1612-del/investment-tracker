[project]
name = "investment-tracker-api"
version = "0.1.0"
description = "Investment Tracker API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests"]
